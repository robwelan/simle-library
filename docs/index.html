<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMLE Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .book-gloss {
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <header class="bg-white border-b border-slate-200 py-10 mb-12">
        <div class="max-w-7xl mx-auto px-6">
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter">SIMLE <span class="text-blue-600">LIBRARY</span></h1>
            <p class="text-slate-500 mt-2 uppercase tracking-[0.2em] text-[10px] font-bold">Standardized Interactive Media & Learning Engine</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="col-span-full flex flex-col items-center py-20">
                <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 font-medium">Loading Manifest...</p>
            </div>
        </div>
    </main>

    <script>
        // Configuration Constants
        // This assumes paths.json is a sibling to the docs folder
        const PATHS_CONFIG_URL = '../paths.json';
        const IMAGE_SUBFOLDER = 'assets/images';

        async function initLibrary() {
            const grid = document.getElementById('library-grid');

            try {
                // 1. Fetch paths from config first
                const pathsResponse = await fetch(PATHS_CONFIG_URL);
                let baseBooksUrl = '../books'; // Default fallback

                if (pathsResponse.ok) {
                    const paths = await pathsResponse.json();
                    // If books are in /src/books and this is in /src/docs, we use '../books'
                    if (paths.search_dir) {
                        // Extract the folder name (e.g., 'books') and point to it as a sibling
                        baseBooksUrl = `../${paths.search_dir.split('/').pop()}`;
                    }
                }

                // 2. Fetch the library JSON generated by the Python script
                const response = await fetch('./library.json');
                if (!response.ok) throw new Error('Could not load library.json');

                const books = await response.json();

                if (books.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-medium text-lg italic underline decoration-slate-200 underline-offset-8 tracking-tight">No books found in the library.</div>`;
                    return;
                }

                grid.innerHTML = books.map(book => {
                    const bookFolder = (book.path || '').trim();
                    const landscapeFile = (book.landscape || '').trim();
                    const title = book.title || 'Untitled';
                    const color = book.cover_color || '#3b82f6';
                    const icon = book.icon || '📚';
                    const version = book.version || '1.0.0';

                    // URL to the book's specific index.html
                    const readerUrl = `${baseBooksUrl}/${bookFolder}/index.html`;

                    // Pathing logic: [base_books_url]/[folder]/assets/images/[filename]
                    const hasImage = landscapeFile !== "";
                    const imageUrl = hasImage ? `${baseBooksUrl}/${bookFolder}/${IMAGE_SUBFOLDER}/${landscapeFile}` : null;

                    return `
                        <article class="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all duration-500 border border-slate-200 flex flex-col h-full">
                            <a href="${readerUrl}" class="block aspect-[16/9] overflow-hidden relative bg-slate-200">
                                ${hasImage ? `
                                    <img
                                        src="${imageUrl}"
                                        alt="${title}"
                                        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000"
                                        onerror="this.parentElement.querySelector('.fallback-ui').style.display='flex'; this.style.display='none';"
                                    >
                                    <div class="fallback-ui hidden w-full h-full absolute inset-0 flex-col items-center justify-center text-white p-6 text-center" style="background-color: ${color}">
                                        <div class="book-gloss absolute inset-0"></div>
                                        <span class="text-4xl mb-2 relative z-10">${icon}</span>
                                        <span class="font-bold text-sm relative z-10 uppercase tracking-wider">${title}</span>
                                        <span class="text-[8px] opacity-50 mt-2 relative z-10 text-white">IMAGE LOAD ERROR</span>
                                    </div>
                                ` : `
                                    <div class="w-full h-full flex flex-col items-center justify-center text-white p-8 text-center relative" style="background-color: ${color}">
                                        <div class="book-gloss absolute inset-0"></div>
                                        <span class="text-5xl mb-4 relative z-10 transform group-hover:scale-110 transition-transform duration-500">${icon}</span>
                                        <h3 class="font-black text-lg leading-tight relative z-10 drop-shadow-md">${title.toUpperCase()}</h3>
                                        <div class="mt-4 w-12 h-1 bg-white/30 rounded-full relative z-10"></div>
                                    </div>
                                `}

                                <div class="absolute top-4 left-4 bg-black/20 backdrop-blur-md text-[10px] font-bold text-white px-2 py-1 rounded-md border border-white/20">
                                    v${version}
                                </div>
                            </a>

                            <div class="p-8 flex flex-col flex-grow">
                                <div class="mb-4">
                                    <h2 class="text-2xl font-extrabold text-slate-900 leading-tight group-hover:text-blue-600 transition-colors">
                                        <a href="${readerUrl}">${title}</a>
                                    </h2>
                                    <p class="text-sm text-slate-400 mt-1 font-semibold uppercase tracking-tighter">By ${book.author || 'Unknown'}</p>
                                </div>
                                <p class="text-slate-600 text-sm leading-relaxed line-clamp-3 mb-8">
                                    ${book.description || 'No description provided.'}
                                </p>
                                <div class="mt-auto">
                                    <a href="${readerUrl}"
                                       class="w-full inline-flex items-center justify-center text-center px-6 py-4 rounded-2xl font-bold text-sm transition-all duration-300 bg-slate-900 text-white hover:bg-blue-600 hover:shadow-lg hover:shadow-blue-200 active:scale-95">
                                        READ NOW
                                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                    </a>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');

            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500 font-bold">${error.message}</div>`;
            }
        }

        window.onload = initLibrary;
    </script>
</body>
</html>
