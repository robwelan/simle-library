<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMLE Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .book-gloss {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.1) 100%
        );
      }

      /* Reader UI */
      #simle-reader-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #0a0a0c;
        z-index: 100;
        color: white;
        overflow: hidden;
      }

      .reader-grid {
        display: grid;
        grid-template-columns: 280px 1fr 80px;
        grid-template-rows: 64px 1fr;
        height: 100vh;
        width: 100vw;
      }

      @media (max-width: 1024px) {
        .reader-grid {
          grid-template-columns: 1fr 60px;
          grid-template-rows: 64px 1fr 64px;
        }
        .sidebar-toc {
          display: none;
        }
      }

      /* The Canvas Stage - Constrains the WASM output to a book shape */
      .stage-container {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: radial-gradient(circle at center, #1a1a20 0%, #0a0a0c 100%);
      }

      canvas#simle-canvas {
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        background: #fff; /* Fallback for white pages */
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Responsive aspect ratios */
      .portrait-mode canvas#simle-canvas {
        aspect-ratio: 3 / 4;
      }
      .landscape-mode canvas#simle-canvas {
        aspect-ratio: 3 / 2;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen font-sans">
    <!-- Library View -->
    <div id="library-view">
      <header class="bg-white border-b border-slate-200 py-10 mb-12">
        <div
          class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row md:items-end justify-between gap-6"
        >
          <div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter">
              SIMLE <span class="text-blue-600">LIBRARY</span>
            </h1>
            <p
              class="text-slate-500 mt-2 uppercase tracking-[0.2em] text-[10px] font-bold"
            >
              Standardized Interactive Media & Learning Engine
            </p>
          </div>
          <div
            id="wasm-status"
            class="flex items-center bg-slate-100 px-4 py-2 rounded-full border border-slate-200 transition-all"
          >
            <div
              id="status-dot"
              class="w-2.5 h-2.5 bg-slate-300 rounded-full mr-3"
            ></div>
            <span
              id="status-text"
              class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none"
              >Engine Offline</span
            >
          </div>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-6 pb-24">
        <div
          id="library-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"
        >
          <!-- Books injected here -->
        </div>
      </main>
    </div>

    <!-- Engine Reader Overlay -->
    <div id="simle-reader-overlay">
      <div class="reader-grid h-full">
        <!-- Top Nav -->
        <nav
          class="col-span-full border-b border-white/10 px-6 flex items-center justify-between bg-black/20 backdrop-blur-md"
        >
          <div class="flex items-center gap-4">
            <button
              id="close-reader"
              class="hover:bg-white/10 p-2 rounded-lg transition-colors"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                ></path>
              </svg>
            </button>
            <h2
              id="reader-title"
              class="font-bold text-sm uppercase tracking-widest text-slate-400"
            >
              Loading Book...
            </h2>
          </div>
          <div id="reader-controls" class="flex gap-2">
            <button
              class="bg-white/5 hover:bg-white/10 px-3 py-1 rounded text-xs"
            >
              Settings
            </button>
            <button
              id="toggle-spread"
              class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs font-bold transition-colors"
            >
              Open Book
            </button>
          </div>
        </nav>

        <!-- Sidebar (ToC) -->
        <aside
          class="sidebar-toc border-r border-white/5 bg-black/40 overflow-y-auto p-6"
        >
          <h3
            class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-6"
          >
            Contents
          </h3>
          <ul id="toc-list" class="space-y-4">
            <!-- Dynamic ToC -->
          </ul>
        </aside>

        <!-- Main Stage -->
        <section class="stage-container portrait-mode" id="stage">
          <!-- WASM Engine attaches here -->
          <canvas id="simle-canvas"></canvas>
        </section>

        <!-- Command/Quick Tools Bar -->
        <aside
          class="flex flex-col items-center py-6 gap-6 bg-black/20 border-l border-white/5"
        >
          <button title="Bookmark" class="text-slate-400 hover:text-white">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path>
            </svg>
          </button>
          <button title="Search" class="text-slate-400 hover:text-white">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
          <div
            class="mt-auto text-[10px] font-mono text-slate-600 vertical-text rotate-180"
            style="writing-mode: vertical-rl"
          >
            SIMLE CORE v0.1
          </div>
        </aside>
      </div>
    </div>

    <script type="module">
      let simleEngine = null;
      let currentBook = null;
      const isGitHub = window.location.hostname.includes('github.io');

      const pathsUrl = isGitHub ? './paths.json' : '../paths.json';
      const wasmPath = isGitHub
        ? './shared-assets/wasm/simle_engine_core.js'
        : '../shared-assets/wasm/simle_engine_core.js';

      async function initLibrary() {
        const grid = document.getElementById('library-grid');

        try {
          const pathsResponse = await fetch(pathsUrl);
          const paths = await pathsResponse.json();

          // Initialize Engine
          try {
            const wasmModule = await import(wasmPath);
            await wasmModule.default();
            simleEngine = wasmModule;
            document.getElementById('status-dot').className =
              'w-2.5 h-2.5 bg-emerald-500 rounded-full mr-3 shadow-[0_0_8px_rgba(16,185,129,0.6)]';
            document.getElementById('status-text').innerText = 'Engine Ready';
            document
              .getElementById('status-text')
              .classList.replace('text-slate-400', 'text-emerald-600');
          } catch (e) {
            console.warn('Engine Offline', e);
          }

          const response = await fetch('./library.json');
          const books = await response.json();

          let baseBooksUrl = isGitHub
            ? paths.web_paths.server_books_base
            : paths.web_paths.local_books_base;
          if (
            !isGitHub &&
            !baseBooksUrl.startsWith('http') &&
            !baseBooksUrl.startsWith('..')
          ) {
            baseBooksUrl = '../' + baseBooksUrl.replace(/^\//, '');
          }

          grid.innerHTML = books
            .map(
              (book) => `
                    <article class="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-slate-200 flex flex-col h-full">
                        <div class="aspect-[16/9] bg-slate-200 relative overflow-hidden">
                            <div class="w-full h-full flex flex-col items-center justify-center text-white p-8 text-center relative" style="background-color: ${book.cover_color || '#3b82f6'}">
                                <div class="book-gloss absolute inset-0"></div>
                                <span class="text-5xl mb-4 relative z-10">${book.icon || '📚'}</span>
                                <h3 class="font-black text-lg leading-tight relative z-10">${book.title.toUpperCase()}</h3>
                            </div>
                        </div>
                        <div class="p-8 flex flex-col flex-grow">
                            <h2 class="text-2xl font-extrabold text-slate-900 mb-2">${book.title}</h2>
                            <p class="text-slate-600 text-sm mb-8 line-clamp-3">${book.description}</p>
                            <button onclick="window.openBook(${JSON.stringify(book).replace(/"/g, '&quot;')}, '${baseBooksUrl}')"
                                    class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-blue-600 transition-colors uppercase tracking-widest text-xs">
                                Read Now
                            </button>
                        </div>
                    </article>
                `,
            )
            .join('');

          window.openBook = (book, baseUrl) => {
            currentBook = book;
            const overlay = document.getElementById('simle-reader-overlay');
            const stage = document.getElementById('stage');
            const title = document.getElementById('reader-title');
            const toc = document.getElementById('toc-list');

            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
            title.innerText = book.title;

            // Initial State: Portrait Cover
            stage.className = 'stage-container portrait-mode';

            // Populate Mock ToC
            toc.innerHTML = (
              book.chapters || [
                'Cover',
                'Introduction',
                'Chapter 1',
                'Chapter 2',
              ]
            )
              .map(
                (c, i) => `
                        <li class="text-sm ${i === 0 ? 'text-blue-400 font-bold' : 'text-slate-400'} cursor-pointer hover:text-white transition-colors">
                            ${c}
                        </li>
                    `,
              )
              .join('');

            const absoluteBookPath = `${baseUrl}/${book.path}/`.replace(
              /\/+/g,
              '/',
            );

            if (simleEngine && typeof simleEngine.load_book === 'function') {
              simleEngine.load_book(absoluteBookPath, 'simle-canvas');
            }
          };
        } catch (err) {
          grid.innerHTML = `<p class="text-red-500">${err.message}</p>`;
        }
      }

      // Toggle between Cover (Portrait) and Open Book (Landscape Spread)
      document.getElementById('toggle-spread').onclick = (e) => {
        const stage = document.getElementById('stage');
        const btn = e.currentTarget;

        if (stage.classList.contains('portrait-mode')) {
          stage.classList.replace('portrait-mode', 'landscape-mode');
          btn.innerText = 'Close Book';
          btn.classList.replace('bg-blue-600', 'bg-slate-700');
        } else {
          stage.classList.replace('landscape-mode', 'portrait-mode');
          btn.innerText = 'Open Book';
          btn.classList.replace('bg-slate-700', 'bg-blue-600');
        }
      };

      document.getElementById('close-reader').onclick = () => {
        document.getElementById('simle-reader-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
      };

      initLibrary();
    </script>
  </body>
</html>
