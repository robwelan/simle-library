[project]
id = "std-001"
version = "1.0.0"
isbn = ""

[cover]
book_cover_layout = "layout-classic"

# Asset for horizontal displays (Desktop/Tablets) | Specs: 16:9 | CSS: --bg-landscape
cover_background_landscape = "cover_art_landscape.webp"

# Asset for vertical displays (Mobile) | Specs: 9:16 | CSS: --bg-portrait
cover_background_portrait = "cover_art_portrait.webp"

[structure]
# Primary locale must be first. Compliance: ISO 639-1 / BCP 47
locales = ["en-us"]

# Reading Order: Must be identical across all locale folders.
content = [
  "project_standard.md",
  "file_structure.md",
  "locales_standard.md",
  "typography_standard.md",
  "shared_assets_logic.md",
  "base_typography_css.md",
  "font_acquisition.md",
  "cover_system_logic.md",
  "cover_art_specifications.md",
  "branding_wordmarks.md"
]
