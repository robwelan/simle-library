name: Build Library Manifest
on:
  push:
    paths:
      - 'books/**'
      - 'web/paths.json'
      - 'build_library.py'
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate JSON
        run: python build_library.py

      - name: Commit manifest
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # This matches your script's output logic (web/library.json)
          git add web/library.json

          if git diff --staged --quiet; then
            echo "No changes to library.json"
          else
            git commit -m "chore: sync library manifest [skip ci]"
            git push
          fi
