# File Path: .github/workflows/deploy.yml
name: Build and Deploy SIMLE Engine

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Engine
        run: wasm-pack build --target web

      - name: Sync Assets and Content to Docs
        run: |
          mkdir -p docs/wasm
          mkdir -p shared-assets/wasm
          SOURCE_PATH="pkg"

          # 1. Sync WASM binaries
          cp $SOURCE_PATH/simle_engine_core.js docs/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm docs/wasm/
          cp $SOURCE_PATH/simle_engine_core.js shared-assets/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm shared-assets/wasm/

          # 2. Sync Content (The "Symlink" fix)
          # We physically copy the root 'books' folder into 'docs'
          # This makes them accessible via relative paths on GitHub Pages
          if [ -d "books" ]; then
            echo "Copying books folder to docs for deployment..."
            cp -r books/ docs/
          else
            echo "Warning: 'books' directory not found at root."
          fi

      - name: Update Version in package.json
        run: |
          npm version patch --no-git-tag-version

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Include docs/books in the git add to ensure content updates are pushed
          git add docs/wasm/ docs/books/ shared-assets/wasm/ package.json

          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync wasm and books content [skip ci]" && git push)
