name: Build and Deploy SIMLE Engine

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches tomllib availability

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Engine
        run: wasm-pack build --target web --out-dir wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Version
        run: npm version patch --no-git-tag-version

      # NEW STEP: Generate the library registry
      - name: Generate Library Registry
        run: python build_library.py

      - name: Assemble Deployment Bundle
        run: |
          # Create a temporary deployment directory
          mkdir -p _site

          # 1. Copy the Frontend (UI/HTML)
          # Note: library.json was just generated into web/ by the python script
          cp -r web/* _site/

          # 2. Copy the newly built WASM binaries
          cp -r wasm _site/

          # 3. Copy the content Library
          if [ -d "books" ]; then
            cp -r books _site/
          fi

          # 4. Copy the Shared Assets (Branding/Art)
          if [ -d "shared_assets" ]; then
            cp -r shared_assets _site/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "chore: deploy simle engine [skip ci]"

      - name: Push Version Update to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump version [skip ci]" && git push origin ${{ github.ref_name }})
