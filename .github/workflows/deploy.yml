# File Path: .github/workflows/deploy.yml
name: Build and Deploy SIMLE Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # Allows you to manually trigger the agent from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    # CRITICAL: This gives the agent permission to push files to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Engine
        # Runs in root where Cargo.toml and package.json are located
        run: wasm-pack build --target web

      - name: Sync Assets to Docs and Shared Assets
        run: |
          mkdir -p docs/wasm
          mkdir -p shared-assets/wasm
          SOURCE_PATH="pkg"

          # Copy to both production (Pages) and development folders
          cp $SOURCE_PATH/simle_engine_core.js docs/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm docs/wasm/
          cp $SOURCE_PATH/simle_engine_core.js shared-assets/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm shared-assets/wasm/

      - name: Update Version in package.json
        run: |
          # Increment the patch version (e.g., 1.0.0 -> 1.0.1) without creating a git tag
          npm version patch --no-git-tag-version

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/wasm/ shared-assets/wasm/ package.json
          # Only commit if files actually changed. [skip ci] prevents infinite loops.
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-compile wasm and bump version [skip ci]" && git push)
