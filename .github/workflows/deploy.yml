# File Path: .github/workflows/deploy.yml
name: Build and Deploy SIMLE Engine

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Engine
        run: wasm-pack build --target web

      - name: Sync Assets and Content to Docs
        run: |
          # 1. Sync WASM binaries to the Root Shared Assets ONLY
          # This is our Source of Truth.
          mkdir -p shared-assets/wasm
          cp pkg/simle_engine_core.js shared-assets/wasm/
          cp pkg/simle_engine_core_bg.wasm shared-assets/wasm/

          # 2. Sync Books to Docs
          if [ -d "books" ]; then
            rm -rf docs/books
            cp -r books docs/
          fi

          # 3. Sync Shared Assets to Docs
          # This move automatically carries the WASM files we just updated in step 1.
          if [ -d "shared-assets" ]; then
            rm -rf docs/shared-assets
            cp -r shared-assets docs/
          fi

          # 4. Sync Config Files
          if [ -f "paths.json" ]; then
            cp paths.json docs/
          fi

      - name: Update Version in package.json
        run: npm version patch --no-git-tag-version

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # We no longer need to add docs/wasm/ because it doesn't exist anymore!
          git add docs/books/ docs/shared-assets/ docs/paths.json shared-assets/ package.json

          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync engine and assets [skip ci]" && git push)
