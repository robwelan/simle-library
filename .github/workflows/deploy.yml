# File Path: .github/workflows/deploy.yml
# This workflow now targets the root directory for the Rust build.

name: Build and Deploy SIMLE Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt-in to Node 24 early to clear the deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Engine
        # Since Cargo.toml is now in the root, we no longer need 'working-directory'
        run: wasm-pack build --target web

      - name: Sync Assets to Docs and Shared Assets
        run: |
          # 1. Create destination directories
          mkdir -p docs/wasm
          mkdir -p shared-assets/wasm

          # 2. Define the source path (wasm-pack builds into /pkg by default)
          SOURCE_PATH="pkg"

          # 3. Copy the generated files to Docs (for GitHub Pages)
          cp $SOURCE_PATH/simle_engine_core.js docs/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm docs/wasm/

          # 4. Copy to Shared Assets (for your internal diagnostics)
          cp $SOURCE_PATH/simle_engine_core.js shared-assets/wasm/
          cp $SOURCE_PATH/simle_engine_core_bg.wasm shared-assets/wasm/

      - name: Update Version in package.json
        run: |
          npm version patch --no-git-tag-version

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/wasm/ shared-assets/wasm/ package.json
          git commit -m "chore: auto-compile wasm engine from root [skip ci]" || echo "No changes to commit"
          git push
