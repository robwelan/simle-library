<div class="book-background"></div>

<div class="simle-cover-container {{book_cover_layout}}">

  <div class="cover-title-zone">
    <img src="{{book_wordmark_title}}"
         alt="Title: {{meta_book_title}}"
         class="wordmark">
  </div>

  <div class="cover-author-zone">
    <img src="{{book_wordmark_author}}"
         alt="Author: {{meta_book_author}}"
         class="wordmark">
  </div>

</div>
