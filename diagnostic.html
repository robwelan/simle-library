<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMLE Infrastructure Diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/smol-toml@1.3.1/+esm"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .log-entry {
        border-left: 2px solid #1e293b;
        padding-left: 12px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-200 p-6 md:p-12 font-mono text-sm leading-relaxed">
    <div class="max-w-4xl mx-auto">
      <header class="mb-10 border-b border-slate-800 pb-6">
        <h1 class="text-3xl font-bold text-white flex items-center gap-3">
          <span class="text-blue-500">SIMLE</span> System Diagnostic
        </h1>
        <div class="flex gap-4 mt-4">
          <span id="env-badge" class="px-2 py-1 rounded bg-slate-800 text-[10px] font-black tracking-widest uppercase italic border border-white/10">Detecting...</span>
          <span id="version-badge" class="px-2 py-1 rounded bg-blue-900/30 text-blue-400 text-[10px] font-black tracking-widest uppercase">Engine v0.1.3</span>
        </div>
      </header>

      <div id="results" class="space-y-6">
        <section class="p-6 bg-slate-900 rounded-xl border border-slate-800 shadow-2xl">
          <h2 class="text-blue-400 font-bold mb-4 uppercase text-xs tracking-[0.2em]">01. Global Config (book.toml)</h2>
          <pre id="debug-book" class="text-[10px] bg-black/50 p-4 rounded border border-slate-800 overflow-auto max-h-40 text-blue-400">Loading...</pre>
        </section>

        <section class="p-6 bg-slate-900 rounded-xl border border-slate-800 shadow-2xl">
          <h2 class="text-amber-400 font-bold mb-4 uppercase text-xs tracking-[0.2em]">02. Locale Config (meta.toml)</h2>
          <pre id="debug-meta" class="text-[10px] bg-black/50 p-4 rounded border border-slate-800 overflow-auto max-h-40 text-amber-500">Loading...</pre>
        </section>

        <section class="p-6 bg-slate-900 rounded-xl border border-slate-800 shadow-2xl">
          <h2 class="text-purple-400 font-bold mb-4 uppercase text-xs tracking-[0.2em]">03. Landscape Cover Probe</h2>
          <div id="asset-log" class="mb-6 space-y-1"></div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div id="img-container" class="relative aspect-video bg-slate-800 rounded-lg flex items-center justify-center overflow-hidden border-2 border-dashed border-slate-700">
              <span class="text-xs text-slate-600 uppercase font-bold tracking-tighter">Visual Buffer Empty</span>
            </div>
            <div class="space-y-4">
              <div class="p-4 bg-purple-900/10 rounded-lg border border-purple-500/20">
                <h3 class="text-purple-300 font-bold text-xs mb-2 uppercase tracking-tighter">Asset Metadata</h3>
                <div id="probe-details" class="text-[11px] text-slate-400 space-y-2"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module">
      import { parse } from 'https://cdn.jsdelivr.net/npm/smol-toml@1.3.1/+esm';

      async function runDiagnostic() {
        const ui = {
          badge: document.getElementById('env-badge'),
          asset: document.getElementById('asset-log'),
          img: document.getElementById('img-container'),
          probe: document.getElementById('probe-details'),
          debugBook: document.getElementById('debug-book'),
          debugMeta: document.getElementById('debug-meta')
        };

        const log = (msg, type = 'info') => {
          const colors = { info: 'text-slate-400', success: 'text-green-400 font-bold', error: 'text-red-500 font-bold', warn: 'text-amber-400' };
          ui.asset.innerHTML += `<div class="log-entry ${colors[type]}">→ ${msg}</div>`;
        };

        try {
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          ui.badge.textContent = isLocal ? 'Local Dev' : 'Production';

          const pathsRes = await fetch('./paths.json');
          const paths = await pathsRes.json();
          const libRes = await fetch('./library.json');
          const library = await libRes.json();

          const testBook = library[0];
          const baseBooksUrl = isLocal ? paths.web_paths.local_books_base : paths.web_paths.server_books_base;

          // Absolute root for the book
          const bookRootUrl = new URL(testBook.path + '/', new URL(baseBooksUrl + '/', window.location.href)).href;
          const locale = testBook.active_locale || 'en-us';

          // 1. Load book.toml
          const bookRes = await fetch(`${bookRootUrl}book.toml`);
          const bookData = parse(await bookRes.text());
          ui.debugBook.textContent = JSON.stringify(bookData, null, 2);

          // 2. Load meta.toml
          const metaRes = await fetch(`${bookRootUrl}content/${locale}/meta.toml`);
          const metaData = parse(await metaRes.text());
          ui.debugMeta.textContent = JSON.stringify(metaData, null, 2);

          // 3. Resolve Landscape Background (Global Asset)
          const landscapeFile = bookData.cover?.cover_background_landscape;
          // Resolved Path: [root]/assets/images/[filename]
          const landscapeUrl = new URL(`assets/images/${landscapeFile}`, bookRootUrl).href;

          // 4. Resolve Wordmark (Localized Asset)
          const wordmarkValue = metaData.cover_wordmarks?.book_wordmark_title;
          const wordmarkUrl = new URL(wordmarkValue, bookRootUrl).href;

          log(`Testing Landscape: ${landscapeFile}`, 'success');
          log(`Wordmark Found: ${wordmarkValue}`, 'info');

          // 5. Visual Probe (Testing Landscape Background)
          const img = new Image();
          img.src = landscapeUrl;
          img.className = 'w-full h-full object-cover animate-in fade-in duration-1000';
          img.onload = () => {
            ui.img.innerHTML = '';
            ui.img.appendChild(img);
          };
          img.onerror = () => {
            ui.img.innerHTML = `<div class="text-center p-4"><p class="text-red-500 font-bold text-[10px]">404: COVER MISSING</p><p class="text-[8px] mt-1 break-all">${landscapeUrl}</p></div>`;
          };

          ui.probe.innerHTML = `
            <div class="space-y-3">
              <div>
                <p class="text-blue-400 font-bold uppercase text-[9px]">Landscape Background (Global)</p>
                <p class="text-white break-all">${landscapeUrl}</p>
              </div>
              <div class="pt-2 border-t border-slate-800">
                <p class="text-purple-400 font-bold uppercase text-[9px]">Wordmark Title (Localized)</p>
                <p class="text-white break-all">${wordmarkUrl}</p>
              </div>
            </div>
          `;

        } catch (err) {
          log(err.message, 'error');
        }
      }

      window.onload = runDiagnostic;
    </script>
  </body>
</html>
