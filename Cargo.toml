[package]
name = "simle-engine-core"
version = "0.0.1"
edition = "2021"
authors = ["robwelan"]
description = "High-performance core for the Simple Interactive Multilingual Learning Engine"

# Build Location Note:
# This source now lives in the root directory / to fix the GitHub Action path error.
# The output .wasm should be copied to /shared-assets/wasm/ after build.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
# FIXED: Changed underscore to hyphen to match crates.io naming
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.69"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
