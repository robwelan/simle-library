[package]
name = "simle-engine-core"
version = "0.0.1"
edition = "2021"
authors = ["robwelan"]
description = "High-performance core for the Simple Interactive Multilingual Learning Engine"
repository = "https://github.com/robwelan/simle-library"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Standard WASM bindings
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"

# Serialization logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"

# NEW: Required to parse your .toml files
toml = "0.8.12"

[profile.release]
# Optimize for smallest binary size
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
