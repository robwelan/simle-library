<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simle Engine Content Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900 text-white p-8 font-mono text-sm">
    <div class="max-w-3xl mx-auto">
      <div
        class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2"
      >
        <h1 class="text-2xl font-bold flex items-center gap-4">
          Diagnostic
          <div id="book-selector-container"></div>
        </h1>
        <div
          id="env-badge"
          class="px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest bg-slate-700"
        >
          Detecting...
        </div>
      </div>

      <div
        id="status"
        class="p-4 rounded mb-6 bg-slate-800 border border-slate-700 whitespace-pre-wrap transition-all duration-300"
      >
        Initializing Diagnostic...
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <button
          id="prev"
          class="bg-slate-700 p-3 rounded hover:bg-slate-600 transition-colors"
        >
          ← Previous Page
        </button>
        <button
          id="next"
          class="bg-slate-700 p-3 rounded hover:bg-slate-600 transition-colors"
        >
          Next Page →
        </button>
      </div>

      <div
        id="viewer"
        class="bg-slate-950 border border-slate-800 rounded-lg p-6 min-h-[400px] overflow-auto shadow-2xl"
      >
        <pre id="content" class="text-blue-300">Waiting for engine...</pre>
      </div>
    </div>

    <script type="module">
      let engine = null;
      let currentPage = 0;
      let SimleEngineClass = null;
      let projectPaths = null;
      let libraryData = null;

      const status = document.getElementById('status');
      const envBadge = document.getElementById('env-badge');

      async function boot() {
        try {
          const isLocal =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1';
          const wasmDir = isLocal ? '../wasm' : './wasm';

          envBadge.innerText = isLocal ? 'Local Dev' : 'Production';
          envBadge.className = isLocal
            ? 'px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest bg-blue-600'
            : 'px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest bg-emerald-600';

          // 1. WASM Setup
          const wasmModule = await import(
            `${wasmDir}/simle_engine_core.js?v=${Date.now()}`
          ); // Cache bust
          await wasmModule.default();
          SimleEngineClass = wasmModule.SimleEngine;

          // 2. Load Global Manifests
          const [pRes, lRes] = await Promise.all([
            fetch('./paths.json'),
            fetch('./library.json'),
          ]);
          projectPaths = await pRes.json();
          libraryData = await lRes.json();

          // 3. Create Book Selector
          const container = document.getElementById('book-selector-container');
          const select = document.createElement('select');
          select.className =
            'bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 outline-none focus:border-blue-500';
          select.innerHTML = libraryData
            .map((b) => `<option value="${b.id}">${b.title}</option>`)
            .join('');
          select.onchange = (e) => loadBook(e.target.value);
          container.appendChild(select);

          // 4. Load Initial Book
          await loadBook(libraryData[0].id);
        } catch (e) {
          console.error('Boot Error:', e);
          status.className =
            'p-4 rounded mb-6 bg-red-900 border border-red-700 text-red-100';
          status.innerText = `CRITICAL BOOT ERROR: ${e.message}`;
        }
      }

      async function loadBook(bookId) {
        const isLocal =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1';
        const bookData = libraryData.find((b) => b.id === bookId);

        // UI Feedback
        status.className =
          'p-4 rounded mb-6 bg-slate-800 border border-slate-700 text-yellow-400 animate-pulse';
        status.innerText = `Swapping to: ${bookData.title}...`;

        const base = isLocal
          ? projectPaths.web_paths.local_books_base
          : projectPaths.web_paths.server_books_base;
        const bookRoot = `${base}/${bookData.path}`.replace(/\/+/g, '/');

        try {
          // IMPORTANT: Match your exact folder structure for book.toml and meta.toml
          const configUrl = `${bookRoot}/book.toml`;
          const metaUrl = `${bookRoot}/content/${bookData.active_locale}/meta.toml`;

          console.log('Fetching Manifests:');
          console.table({ configUrl, metaUrl });

          const [resConfig, resMeta] = await Promise.all([
            fetch(configUrl),
            fetch(metaUrl),
          ]);

          if (!resConfig.ok)
            throw new Error(`HTTP ${resConfig.status} for book.toml`);
          if (!resMeta.ok)
            throw new Error(`HTTP ${resMeta.status} for meta.toml`);

          const configToml = await resConfig.text();
          const metaToml = await resMeta.text();

          // Clean up old engine before creating new one
          engine = null;

          engine = new SimleEngineClass(
            configToml,
            metaToml,
            JSON.stringify(projectPaths),
            isLocal,
          );

          currentPage = 0;

          // FORCE RE-RENDER OF BANNER
          status.className =
            'p-4 rounded mb-6 bg-green-900 border border-green-700 text-green-100 animate-none';
          status.innerHTML = `
                    <div class="font-black text-xs uppercase opacity-50 mb-1">Engine Active</div>
                    <div class="text-xl font-bold">${engine.get_title()}</div>
                    <div class="mt-2 text-[10px] opacity-70">${engine.total_pages()} Total Pages | Locale: ${engine.get_default_locale()}</div>
                `;

          updatePage();
        } catch (e) {
          console.error('Load Error:', e);
          status.className =
            'p-4 rounded mb-6 bg-red-900 border border-red-700 text-red-100 animate-none';
          status.innerText = `LOAD ERROR [${bookData.title}]: ${e.message}`;
        }
      }

      function updatePage() {
        if (!engine) return;
        try {
          // 1. Get the current page data from Rust
          const data = engine.get_page(currentPage);

          // 2. Update the JSON code viewer
          document.getElementById('content').innerText = JSON.stringify(
            data,
            null,
            2,
          );

          // 3. Update the Green Banner to reflect the current page/progress
          status.innerHTML = `
            <div class="font-black text-xs uppercase opacity-50 mb-1">Engine Active</div>
            <div class="text-xl font-bold">${engine.get_title()}</div>
            <div class="mt-2 text-[10px] opacity-70">
                Page ${currentPage + 1} of ${engine.total_pages()} |
                Type: <span class="text-yellow-400">${data.type}</span> |
                Locale: ${engine.get_default_locale()}
            </div>
        `;
        } catch (e) {
          console.error('Render Error:', e);
          document.getElementById('content').innerText =
            `Error rendering page ${currentPage}: ${e}`;
        }
      }

      document.getElementById('next').onclick = () => {
        if (engine && currentPage < engine.total_pages() - 1) {
          currentPage++;
          updatePage();
        }
      };

      document.getElementById('prev').onclick = () => {
        if (engine && currentPage > 0) {
          currentPage--;
          updatePage();
        }
      };

      boot();
    </script>
  </body>
</html>
